name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  contracts:
    name: Format, lint and test
    runs-on: ubuntu-latest
    # The indexer's database tests create and drop their own databases here.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: veil
          POSTGRES_PASSWORD: veil
          POSTGRES_DB: veil
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veil -d veil"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      VEIL_TEST_DATABASE_URL: postgres://veil:veil@localhost:5432/veil
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel, components and wasm targets.
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The policy-fixture integration test proves a circuit, which needs the
      # compiled artifacts. The circuit job below covers it.
      - name: Test
        run: cargo test --workspace --exclude policy-fixture --locked

      - name: Build contract wasm
        run: cargo build --release --target wasm32v1-none -p pool -p asp-membership -p circom-groth16-verifier --locked

  images:
    name: Service images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [indexer, api]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Builds each runtime image without pushing it, so a Dockerfile or
      # build break shows up on the pull request rather than at deploy time.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: false
          tags: veil-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Fails on any advisory not accepted in .cargo/audit.toml, where each
      # accepted one is listed with the reason.
      - name: Audit Cargo.lock
        run: cargo audit

  circuit:
    name: Circuit and proof round trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Builds circom 2.2.3 into target/cargo-tools and fetches the pinned
      # circomlib revision, then compiles the circuit to r1cs and witness WASM.
      - name: Compile the policy circuit
        run: |
          ./scripts/install-circom.sh
          ./scripts/compile-policy-circuit.sh

      # Proves against the committed proving key and settles the proof through
      # the pool, the ASP membership contract and the Groth16 verifier.
      - name: Prove and settle
        run: cargo test -p policy-fixture --locked
