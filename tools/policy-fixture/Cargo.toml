[package]
name = "policy-fixture"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
# Keep `cargo run -p policy-fixture` (make generate-policy-fixture) unambiguous
# now that the crate also ships the `regen-from-zkey` binary.
default-run = "policy-fixture"

[dependencies]
anyhow = { workspace = true, features = ["std"] }
ark-bn254 = { workspace = true, features = ["std"] }
ark-circom = { workspace = true, features = ["parallel"] }
ark-ff = { workspace = true, features = ["std"] }
ark-groth16 = { workspace = true, features = ["std"] }
ark-serialize = { workspace = true, features = ["std"] }
ark-snark = { workspace = true }
ark-std = { workspace = true, features = ["std"] }
circuit-keys = { workspace = true }
hex = { workspace = true, features = ["std"] }
num-bigint = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
zkhash = { workspace = true }

[dev-dependencies]
asp-membership = { workspace = true }
circom-groth16-verifier = { workspace = true }
contract-types = { workspace = true }
pool = { workspace = true }
soroban-sdk = { workspace = true, features = ["testutils"] }
