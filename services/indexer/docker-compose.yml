# Local Postgres for developing and testing the indexer.
#
#   docker compose -f services/indexer/docker-compose.yml up -d
#   export DATABASE_URL=postgres://veil:veil@localhost:5433/veil
#
# Not used in any deployment. Port 5433 avoids clashing with a Postgres
# already running on the default port.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: veil
      POSTGRES_PASSWORD: veil
      POSTGRES_DB: veil
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veil -d veil"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - veil-indexer-pg:/var/lib/postgresql/data

volumes:
  veil-indexer-pg:
